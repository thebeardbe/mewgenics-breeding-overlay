name: ci

# Runs the Python test suite on every push to the default branch and every
# pull request, so breakage is caught before a release. The release workflow
# (release.yml) only runs on v* tags, so this is the day-to-day safety net.
#
# Manual trigger available under Actions -> ci -> Run workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      # One OS today; keep fail-fast off so a future multi-OS matrix still
      # reports every entry instead of cancelling the rest.
      fail-fast: false
      # ubuntu-latest only: several modules in the suite cannot pass on a
      # Windows runner (they create symbolic links without holding the
      # privilege, they execute a bash script through its shebang, and they
      # isolate configuration through an environment variable the application
      # deliberately ignores on Windows). The suite has never been run on
      # Windows, so a windows entry would be red on every push. Windows
      # coverage stays with the release workflow's build and import smoke. A
      # windows entry can be added once the suite is ported.
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Cap hung runs; GitHub's default is multi-hour.
    timeout-minutes: 15
    env:
      # Same layout the release workflow uses: the package lives under src/.
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt offscreen plugin + GL/xcb/dbus libs needed so the UI tests can
      # construct widgets without a display. The guard keeps this step correct
      # if a Windows matrix entry is added later.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "PySide6-Essentials>=6.5" pytest

      # No save is committed here: Mewgenics saves are game data and shipping
      # them in the repository is not ours to do. Three modules in the suite
      # read MEWGENICS_SAMPLE_SAV and skip when it is unset, which would leave
      # the save-dependent cases unenforced in CI. Fetch one from the upstream
      # parser project instead, pinned to the exact revision the vendored
      # engine was synced from (the branch would drift underneath us) and
      # hash-checked so a substituted archive fails the job instead of being
      # parsed. Deliberately fatal: if the sample cannot be fetched the job
      # fails rather than quietly going back to skipping.
      - name: Fetch a sample save
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/saves.zip" \
            https://raw.githubusercontent.com/whyayala/MewgenicsBreedingManager/032bffb968ae35a9904547ae06054633ebc9865b/tools/saves/saves.zip
          echo "0d9b999fa44980bc18b1ee3316c1ee3784cc5cfbdafdda88ede5e8807eeb6764  $RUNNER_TEMP/saves.zip" | sha256sum -c -
          python - <<'PY'
          import os
          import zipfile

          dest = os.path.join(os.environ["RUNNER_TEMP"], "sample-save")
          os.makedirs(dest, exist_ok=True)
          archive = os.path.join(os.environ["RUNNER_TEMP"], "saves.zip")
          with zipfile.ZipFile(archive) as zf:
              zf.extract("21cats.sav", dest)
          save = os.path.join(dest, "21cats.sav")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"MEWGENICS_SAMPLE_SAV={save}\n")
          PY

      - name: Run tests
        # No path passed: pyproject.toml [tool.pytest.ini_options] already
        # declares testpaths = ["tests"].
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
