name: build

# Builds self-contained binaries for Windows and Linux on every push to a
# v* tag and attaches them to a GitHub Release. Nobody who downloads the
# release needs Python — they just run the binary.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Manual trigger available under Actions -> build -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version-check:
    # The version lives in THREE places (pyproject.toml, default.nix,
    # src/mewgenics_overlay/__init__.py) and a release tag vX.Y.Z must equal
    # all of them. This job refuses any tagged push where they disagree —
    # partial bumps are release blockers by design (CODING_GUIDELINES.md 0.3).
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version parity across the three files + the tag
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib
          repo = pathlib.Path(".")
          pyproject = tomllib.loads(repo.joinpath("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"',
                           repo.joinpath("src/mewgenics_overlay/__init__.py").read_text()).group(1)
          nix = re.search(r'version = "([^"]+)"',
                          repo.joinpath("default.nix").read_text()).group(1)
          tag = "${{ github.ref_name }}"
          if tag.startswith("v"):
              tag = tag[1:]
          versions = {"pyproject.toml": pyproject, "__init__.py": init, "default.nix": nix}
          bad = {k: v for k, v in versions.items() if v != tag}
          if bad:
              print(f"version mismatch: tag={tag} but {bad}")
              sys.exit(1)
          print(f"version parity OK across all three files + tag: {tag}")
          PY

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MewgenicsOverlay-windows-x64
            script: packaging\build_windows.bat
            binary: dist\MewgenicsOverlay.exe
          - os: ubuntu-latest
            artifact: MewgenicsOverlay-linux-x64
            script: bash packaging/build_linux.sh
            binary: dist/MewgenicsOverlay
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt offscreen plugin + GL libs needed for the import smoke test on Linux
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "PySide6-Essentials>=6.5" pyinstaller

      - name: Smoke test (imports + offscreen widget construction)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("XDG_CONFIG_HOME", os.path.abspath(".ci-cfg"))
          from PySide6.QtWidgets import QApplication
          from mewgenics_overlay.ui.palette import PaletteWindow
          app = QApplication([])
          PaletteWindow()
          print("smoke-ok")
          PY
        shell: bash

      - name: Build binary
        run: ${{ matrix.script }}

      - name: Verify binary exists
        run: test -f "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 📦 Which file do I download?

            **I play on Windows →** grab **`MewgenicsOverlay.exe`** (double-click to run).
            Windows may show a “Windows protected your PC” warning — click **More info → Run anyway**
            (the app is not code-signed; see the [README security note](https://github.com/thebeardbe/mewgenics-breeding-overlay#windows)).

            **I play on Linux (Ubuntu / Arch / Fedora / …) →** grab **`MewgenicsOverlay`** (no file extension).
            Then make it executable and run it:
            ```bash
            chmod +x MewgenicsOverlay
            ./MewgenicsOverlay
            ```

            **I use NixOS →** you don't need a download at all:
            ```bash
            nix run github:thebeardbe/mewgenics-breeding-overlay
            ```

            Full install & usage instructions: [README](https://github.com/thebeardbe/mewgenics-breeding-overlay#readme)
          files: |
            artifacts/MewgenicsOverlay-windows-x64/*
            artifacts/MewgenicsOverlay-linux-x64/*
